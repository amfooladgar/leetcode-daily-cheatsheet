# Central configuration for the pipeline. Nothing secret lives here -
# secrets are always environment variables (see .env.example).

schedule:
  timezone: "America/New_York"
  target_hour: 9          # local hour the run must match to actually publish
  cron_utc:                # both crons fire; src/main.py no-ops outside target_hour
    - "5 13 * * *"          # 09:05 ET during EDT (UTC-4)
    - "5 14 * * *"          # 09:05 ET during EST (UTC-5)

leetcode:
  source: "graphql"
  endpoint: "https://leetcode.com/graphql"
  mode: "daily"             # "daily" | "slug" (slug set via --problem-slug)
  premium_policy: "skip"    # never attempt to bypass a premium-only problem
  request_timeout_seconds: 15
  max_retries: 3

claude:
  # Any Claude Code model name (`claude --model <name>`), see prompts/claude/.
  # Sonnet is the default balance of quality/cost; swap to a cheaper/faster
  # model in prompts that don't need as much reasoning if you want to cut cost.
  model_solve: "claude-sonnet-5"
  model_verify: "claude-sonnet-5"
  model_compress: "claude-sonnet-5"
  # allowed_tools is deliberately empty (see below), so every turn beyond
  # the first is either extended thinking or a denied tool-use attempt the
  # model has to recover from. 4 was too tight in practice -- compress hit
  # "Reached maximum number of turns (4)" after the model twice tried Bash
  # (denied, since allowed_tools is empty) to literally count code lines
  # instead of just reading them. The prompts now say explicitly not to
  # attempt tool use (see prompts/claude/v1/*.md), but this stays raised as
  # a buffer against the same failure mode elsewhere.
  max_turns: 8
  allowed_tools: ""        # empty = pure reasoning, no Bash/file/network access
  output_format: "json"
  # Wall-clock budget per `claude -p --bare` invocation (src/claude/runner.py's
  # subprocess.run timeout). 2026-08-16: the verify stage timed out at the old
  # 180s hardcoded default on one run and took 89s on an identical rerun --
  # pure model-latency variance, not a real hang -- so this is raised and
  # made configurable rather than left as a code constant.
  stage_timeout_seconds: 300

image:
  final_width: 1080
  final_height: 1350
  aspect_ratio: "4:5"
  output_format: "PNG"
  safe_margin_px: 60

design:
  mode: "light"
  # The full palette (gradient headline, semantic diagram states, syntax
  # highlighting) lives in src/rendering/templates/cheatsheet.html.jinja2
  # as CSS custom properties (:root { --primary-1, --teal, --valid, ... }) --
  # this section only carries the values the renderer needs as Python-side
  # config (fonts) rather than duplicating every hex value in two places.
  # Bundled in-repo (assets/fonts/) rather than relying on the CI runner's
  # system fonts, so rendering is byte-for-byte reproducible regardless of
  # which GitHub Actions image is in use. See assets/fonts/LICENSE-DEJAVU.txt.
  font_heading: "assets/fonts/DejaVuSans-Bold.ttf"
  font_body: "assets/fonts/DejaVuSans.ttf"
  font_code: "assets/fonts/DejaVuSansMono.ttf"
  font_code_bold: "assets/fonts/DejaVuSansMono-Bold.ttf"

content:
  show_problem_statement: true
  show_intuition: true
  show_approach: true
  show_example: true
  show_complexity: true
  show_code: true
  headline_max_words: 9
  problem_summary_max_words: 45
  intuition_max_words: 65
  approach_max_steps: 5
  approach_max_words_per_step: 18
  example_max_states: 5
  code_preferred_max_lines: 18
  code_absolute_max_lines: 24

contact_card:
  path: "assets/contact-card.png"
  position: "bottom-right"   # bottom-right | bottom-left
  max_width_px: 210

image_generation:
  # Which renderer produces the published cheat sheet. "existing" (the
  # deterministic HTML/CSS + Playwright renderer above) is the
  # production-safe default -- see ARCHITECTURE.md "Optional OpenAI image
  # renderer" for why "openai" is an explicit, non-default opt-in with a
  # different dimension/QA contract. Resolution order: --image-provider CLI
  # flag > IMAGE_GENERATION_PROVIDER env var > this value.
  enabled: true
  provider: "openai"       # "existing" | "openai"
  # If the openai provider fails (config, API, decode, or compositing) and
  # this is true, fall back to the existing renderer with a logged warning
  # instead of failing the run. Default false: an OpenAI failure should be
  # visible, not silently masked.
  fallback_to_existing: true

  existing:
    width: 1080
    height: 1350

  openai:
    model: "gpt-image-2-2026-04-21"
    width: 1536
    height: 1024
    quality: "high"
    output_format: "png"
    # prompts/openai/<prompt_version>/cheatsheet.txt -- same versioning
    # convention as claude.prompt_version (see prompts/openai/README.md).
    # v3 switched from "reserve a blank rectangle, composite the exact
    # card afterward" to sending the card as an Images Edit API reference
    # image and asking the model to draw it directly -- see
    # prompts/openai/README.md and ARCHITECTURE.md "Optional OpenAI image
    # renderer" for why (two consecutive live runs, 2026-08-16 and
    # 2026-08-17, left too little blank space near the reserved corner
    # for the old flow's minimum-scale check to pass, falling back to the
    # existing renderer both days).
    prompt_version: "v3"
    # The same immutable asset the existing renderer embeds -- never a
    # separate copy (see CLAUDE.md "contact card" rule). For this
    # provider it is sent to the model as an Images Edit API reference
    # image (never written to) rather than composited afterward.
    visiting_card: "assets/contact-card.png"
    card_position: "bottom-right"   # bottom-right | bottom-left -- a placement
    # hint in the prompt only; the model chooses the exact layout instead
    # of a pixel-reserved region.
    # input_fidelity ("high"|"low") asks the Images Edit API to preserve
    # fine detail (faces, logos) from the reference image rather than
    # reinterpreting it. Left unset (the default) because a live smoke
    # test found the configured model above rejects it outright (400
    # invalid_input_fidelity_model) instead of ignoring it -- only set
    # this if you've confirmed your chosen model supports it. Preserving
    # the photo currently relies on the CONTACT CARD prompt instructions
    # alone (prompts/openai/v3/cheatsheet.txt).
    # input_fidelity: "high"
    # Ground-truth card text, given to the model explicitly so it
    # re-letters the card from known-correct text instead of relying on
    # reading (and possibly misreading) the reference image -- see
    # src/rendering/openai_prompt.py. Keep in sync with
    # assets/contact-card.png if that file is ever replaced.
    card_name: "Ali Fouladgar"
    card_title: "AI Engineer"
    card_links:
      - label: "Website"
        value: "AliFouladgar.com"
      - label: "LinkedIn"
        value: "@ali-fouladgar"
      - label: "Leetcode"
        value: "amfooladgar"
    # Kept as separate, predictable filenames in the same
    # output/<date>/<problem>/ stage directory as the existing renderer's
    # cheatsheet.png, so neither provider's output can collide with the
    # other's (see ARCHITECTURE.md).
    background_filename: "cheatsheet-openai-background.png"
    final_filename: "cheatsheet-openai-final.png"
    # Bounded exponential backoff (src/utils/retry.py, reused as-is) for
    # retryable rate-limit/server errors only -- auth/validation errors
    # never retry.
    max_retries: 3
    retry_base_delay_seconds: 1.0
    retry_max_delay_seconds: 20.0

drive:
  root_folder_name: "posts"
  category_folder_name: "LeetCode"
  organize_by_year_month: true
  upload_markdown_summary: true

telegram:
  enabled: true
  # {headline}/{number}/{title}/{difficulty}/{url} are filled in from the
  # cheatsheet content + problem URL (see src/main.py's
  # _telegram_caption()). Kept under Telegram's 1024-char caption cap by
  # src/storage/telegram.py regardless of what's templated here.
  caption_template: "{headline}\n\n#{number} {title} ({difficulty})\n{url}"

state:
  manifest_path: "state/manifest.json"

output:
  local_dir: "output"
  filename_pattern: "{number}-{slug}-{date}"

# Public gallery site (scripts/build_gallery.py) -- see ARCHITECTURE.md
# "Gallery site". images_dir is committed to the repo (unlike output/);
# site_dir is a build artifact, regenerated on every deploy, never
# committed -- same "regenerated every run; do not version" pattern as
# output/ (see .gitignore).
gallery:
  images_dir: "gallery/images"
  site_dir: "gallery/site"
  title: "LeetCode Daily Cheat Sheets"
  # Custom domain (Cloudflare-managed, see ARCHITECTURE.md "Gallery site").
  # scripts/build_gallery.py writes this into a CNAME file in every build,
  # since GitHub Pages needs that file present in the published artifact
  # on every Actions-driven deploy or it reverts to the *.github.io URL.
  # Leave "" to serve from the default github.io URL only.
  custom_domain: "leetcode.alifouladgar.com"

# LinkedIn posting has two independent, human-gated paths -- see
# ARCHITECTURE.md "LinkedIn posting" and CLAUDE.md's "Rules". Path A is an
# automatic Telegram now/later prompt inside src/main.py; Path B is the
# manual /post-linkedin Claude Code command. Both require linkedin.enabled;
# Path A additionally requires linkedin.telegram_prompt.enabled.
linkedin:
  enabled: true                     # master kill switch
  visibility: "PUBLIC"              # PUBLIC | CONNECTIONS
  api_version: "202608"             # LinkedIn-Version header (YYYYMM); bump periodically
  telegram_prompt:
    enabled: true                   # sub-switch for the automatic Path A flow
    decision_timeout_seconds: 300   # how long src/main.py waits for a button tap before defaulting to "later"
    poll_interval_seconds: 3        # local polling cadence within the timeout window
