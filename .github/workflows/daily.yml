name: Daily LeetCode Cheat Sheet

# Runs at both 13:05 and 14:05 UTC every day so one of the two legs always
# lands at 09:05 America/New_York regardless of DST. src/main.py's
# _schedule_gate() no-ops the leg that doesn't match the configured
# target_hour. See ARCHITECTURE.md "Daylight saving time".
on:
  schedule:
    - cron: "5 13 * * *"
    - cron: "5 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip Drive upload + manifest write)"
        type: boolean
        default: false
      force:
        description: "Bypass the idempotency guard for today's date"
        type: boolean
        default: false
      problem_slug:
        description: "Optional: fetch a specific problem instead of today's Daily Challenge"
        type: string
        default: ""
      image_provider:
        description: "Image-generation provider (see ARCHITECTURE.md 'Optional OpenAI image renderer')"
        type: choice
        default: "openai"
        options:
          - openai
          - existing

# Prevent two runs from racing (e.g. a manual dispatch during the scheduled
# window) and each stepping on the other's Drive upload / manifest commit.
concurrency:
  group: daily-cheatsheet
  cancel-in-progress: false

permissions:
  contents: write  # to commit state/manifest.json back to main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (renderer runs headless Chromium)
        run: playwright install --with-deps chromium

      # `playwright install` has a documented failure mode where it exits 0
      # without leaving a working browser behind (silent download
      # corruption in CI -- see microsoft/playwright#36412 and ci.yml's
      # matching step). Worth guarding here too: an unnoticed failure on
      # this workflow means a missed day, not just a red CI check.
      - name: Verify Chromium actually launches
        run: python scripts/verify_playwright_chromium.py

      - name: Install Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Add Claude Code to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code is on PATH
        run: claude --version

      - name: Run pipeline
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Owner-only DM used by Path A's LinkedIn now/later prompt --
          # separate from TELEGRAM_CHAT_ID (the public broadcast channel)
          # so those prompts never post there. See docs/SETUP.md step 3b.
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          # Only read by Path A's "post now" branch when a human taps the
          # Telegram button within decision_timeout_seconds (see
          # ARCHITECTURE.md "LinkedIn posting"); the caption-draft and
          # Telegram-prompt steps ahead of that never touch these. Unset
          # secrets just mean that branch fails and falls back to saving a
          # draft, since it's wrapped in the non-blocking except in
          # src/main.py -- see docs/LINKEDIN_POSTING_SETUP.md to obtain them
          # via scripts/authorize_linkedin.py.
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          # Manual runs pick the provider via the workflow_dispatch input
          # above (default "openai"); scheduled runs (no `inputs` context)
          # fall back to the repository variable Settings -> Secrets and
          # variables -> Actions -> Variables -> IMAGE_GENERATION_PROVIDER,
          # defaulting to "existing" if that variable isn't set either --
          # see ARCHITECTURE.md "Optional OpenAI image renderer".
          # OPENAI_API_KEY is scoped to this one step (the only one that
          # can reach the openai renderer) and is only ever read when that
          # path actually runs.
          IMAGE_GENERATION_PROVIDER: ${{ inputs.image_provider || vars.IMAGE_GENERATION_PROVIDER || 'existing' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.problem_slug }}" ]; then ARGS="$ARGS --problem-slug ${{ inputs.problem_slug }}"; fi
          python -m src.main $ARGS -v

      - name: Upload run artifacts (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cheatsheet-output-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit updated manifest and gallery image
        if: always()
        # gallery/images/ must be staged alongside state/manifest.json --
        # src/state/gallery.py::save_gallery_image() writes a new PNG there
        # on every successful publish (see ARCHITECTURE.md "Gallery site"),
        # and gallery.yml's build only finds an entry's card if that image
        # made it into this same commit. `git add gallery/images` is a
        # no-op when nothing new was written (e.g. --dry-run/--skip-drive),
        # so the porcelain check below still covers both paths correctly.
        run: |
          if [ -n "$(git status --porcelain state/manifest.json gallery/images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/manifest.json gallery/images
            git commit -m "chore: update run manifest and gallery image [skip ci]"
            git push
          else
            echo "No manifest or gallery changes to commit."
          fi
