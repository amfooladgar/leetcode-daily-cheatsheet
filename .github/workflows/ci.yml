name: CI

# Runs the test suite and linter on every push/PR. Deliberately does NOT
# install the Claude Code CLI or require any API keys — the whole suite
# mocks LeetCode, Claude, and Google Drive (see
# tests/test_main_integration.py), so CI proves the pipeline's wiring and
# logic without spending a single token or touching a real credential.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (renderer tests screenshot via headless Chromium)
        run: playwright install --with-deps chromium

      # `playwright install` has a documented failure mode where it exits 0
      # without leaving a working browser behind (silent download
      # corruption in CI -- see microsoft/playwright#36412). Fail fast
      # here instead, with one automatic retry.
      - name: Verify Chromium actually launches
        run: python scripts/verify_playwright_chromium.py

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
