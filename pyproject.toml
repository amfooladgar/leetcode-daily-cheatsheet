[project]
name = "leetcode-daily-cheatsheet"
version = "0.1.0"
description = "Daily LeetCode -> Claude Code -> deterministic cheat-sheet -> Google Drive pipeline"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Without this, bare `pytest` (as opposed to `python -m pytest`) never puts
# the repo root on sys.path, so `from src...` imports fail with
# "ModuleNotFoundError: No module named 'src'" -- this bit CI (.github/
# workflows/ci.yml runs plain `pytest -q`) even though `python -m unittest
# discover -s tests` and `python -m pytest` both work locally, since `-m`
# implicitly prepends the current directory to sys.path and bare `pytest`
# does not. `pythonpath` is a native pytest>=7 ini option (no plugin
# needed) and makes every invocation style behave the same.
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py312"]
