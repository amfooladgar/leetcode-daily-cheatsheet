[project]
name = "leetcode-daily-cheatsheet"
version = "0.1.0"
description = "Daily LeetCode -> Claude Code -> deterministic cheat-sheet -> Google Drive pipeline"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py312"]
